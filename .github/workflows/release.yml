name: Release WASM
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Leave blank for master-<short-sha>.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & publish WASM release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install Meson
        run: python3 -m pip install --break-system-packages meson

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            NAME="${{ inputs.tag }}"
          else
            NAME="master-${GITHUB_SHA::7}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Configure + build
        run: |
          meson setup build-wasm --cross-file=crosscompile/emscripten.txt --prefix=/
          meson compile -C build-wasm

      - name: Verify Embind symbols present
        run: |
          for fn in addBuy addSell editPool deleteOrder setFee clearAndSetBaseDecimals; do
            strings build-wasm/fbm.wasm | grep -qx "$fn" \
              || { echo "missing Embind binding: $fn"; exit 1; }
          done

      - name: Stage bundle into out/
        run: DESTDIR="$(pwd)/out" meson install -C build-wasm

      - name: Zip bundle
        run: (cd out && zip -r ../fbm-demo.zip .)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            out/fbm.wasm
            out/fbm.js
            fbm-demo.zip
          fail_on_unmatched_files: true
